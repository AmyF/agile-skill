schema_version: "{{schema_version}}"
release:
  id: "{{release_id}}"
  version: "{{release_version}}"
  profile: "{{profile}}"
  status: "planned"
  owner: "{{owner}}"
  created_at: "{{created_at}}"
  updated_at: "{{updated_at}}"
scope:
  features: []
  stories: []
  change_requests: []
