principles:
  source_of_truth: .agile
  approved_artifacts_are_immutable: true
  latest_files_are_not_approval_targets: true
  ai_must_not_self_approve: true
  bdd_owner_stage: tdd
  ddd_is_risk_based: true
profiles: [app, game]
feature_states: [initialized, intake, prd_draft, prd_ready, story_slicing, ddd_required, ddd_waived, ddd_ready, stories_in_progress, acceptance_ready, git_ready, release_ready, blocked, recovery, cancelled]
story_states: [story_initialized, acceptance_defined, fid_draft, fid_ready, tdd_draft, tdd_ready, implementation_in_progress, evidence_ready, story_accepted, blocked, recovery, cancelled]
tdd_flow_states: [planned, defined, implemented, passed, failed, waived, blocked]
gate_states: [pending, passed, failed, waived]
release_states: [planned, scoped, frozen, verifying, released, monitored, closed, rolled_back, cancelled]
change_request_states: [proposed, impact_analysis, approved, rejected, in_rework, revalidated, closed]
