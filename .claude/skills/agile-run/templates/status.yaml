schema_version: "{{schema_version}}"
project:
  name: "{{repo_name}}"
  profile: "{{profile}}"
  agile_root: ".agile"
workflow:
  current_feature: null
  current_story: null
  current_release: null
  current_stage: "intake"
  current_state: "initialized"
  previous_valid_state: null
  blocked: false
  recovery_required: false
automation:
  model: "automatic_gates"
  machine_gates_auto_advance: true
features: {}
stories: {}
releases: {}
change_requests: {}
pending_revalidation: []
gate_summary:
  passed: []
  failed: []
  waived: []
approvals:
  records: []
checkpoints:
  latest:
    id: "checkpoint-initialized"
    timestamp: "{{created_at}}"
    state: "initialized"
    stage: "intake"
  history:
    - id: "checkpoint-initialized"
      timestamp: "{{created_at}}"
      state: "initialized"
      stage: "intake"
      notes: "Initialized agile runtime."
last_updated_at: "{{updated_at}}"
