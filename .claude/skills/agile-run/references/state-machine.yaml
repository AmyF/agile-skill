principles:
  source_of_truth: .agile
  approved_artifacts_are_immutable: true
  latest_files_are_not_approval_targets: true
  ai_must_not_self_approve: true
  bdd_owner_stage: tdd
feature_states: [initialized, prd_draft, prd_review, prd_approved, ddd_draft, ddd_review, ddd_approved, stories_in_progress, feature_acceptance_draft, feature_acceptance_review, feature_accepted, blocked, recovery, cancelled]
story_states: [story_initialized, fid_draft, fid_review, fid_approved, tdd_draft, tdd_review, tdd_approved, acceptance_draft, acceptance_review, story_accepted, blocked, recovery, cancelled]
tdd_flow_states: [planned, defined, implemented, passed, waived, blocked]
release_states: [planned, scoped, frozen, verifying, released, monitored, closed, rolled_back, cancelled]
change_request_states: [proposed, impact_analysis, approved, rejected, in_rework, revalidated, closed]
