schema_version: "{{schema_version}}"
project:
  name: "{{repo_name}}"
  profile: "{{profile}}"
  provider: "{{repo_provider}}"
  owner: "{{repo_owner}}"
  url: {{repo_url}}
agile:
  root: ".agile"
  initialized_at: "{{created_at}}"
  initialized_by: "{{owner}}"
  workflow_version: "2.0.0"
directories:
  changes: ".agile/changes"
  features: ".agile/features"
  releases: ".agile/releases"
rules:
  approved_artifacts_are_immutable: true
  semantic_change_requires_change_request: true
  latest_files_are_not_approval_targets: true
  ai_must_not_self_approve: true
  bdd_owner_stage: "tdd"
  ddd_policy: "risk_based"
automation:
  model: "automatic_gates"
  machine_gates_auto_advance: true
  semantic_approval_requires_external_source: true
  artifact_depth: "concise_executable"
quality_profiles:
  allowed: ["app", "game"]
  default: "{{profile}}"
validation:
  mode: "skill"
  schemas_location: ".claude/skills/agile-run/schemas"
  scripts_location: ".claude/skills/agile-run/scripts"
integrations:
  git:
    require_branch_metadata: true
    require_commit_metadata: true
    require_pr_metadata: true
  github:
    enabled: false
    mode: "disabled"
    allowed_modes: ["disabled", "file_based", "gh_controlled"]
    remote_mutation_requires_controlled_mode: true
    automation_tool: "gh"
    source_of_truth: ".agile"
